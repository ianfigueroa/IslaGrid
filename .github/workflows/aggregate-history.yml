name: aggregate-history

on:
  # hourly; idempotent
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many days back to aggregate (1-400)"
        required: false
        default: "365"

concurrency:
  group: aggregate-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: ingestion
        run: pip install -e .

      # region-level customer counts -> unplanned outage events
      - name: Detect unplanned outage episodes from LUMA snapshots
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m src.pipeline.luma_snapshots_to_events \
            --backfill-days ${{ github.event.inputs.backfill_days || '365' }}

      - name: Aggregate municipality outage rollup
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # 365d so the rolling year stays filled, not just the last 30 days
        run: |
          python -m src.pipeline.aggregate_municipality_daily \
            --backfill-days ${{ github.event.inputs.backfill_days || '365' }}

      # split region-level hours across the ~50 munis LUMA has no per-incident
      # data for. Runs second and skips (muni, day) rows that already exist.
      - name: Region-split fill-in (silent munis)
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m src.pipeline.aggregate_luma_regions_to_munis \
            --backfill-days ${{ github.event.inputs.backfill_days || '365' }}
