name: backfill-outage-features

# One-shot: build outage_features rows at every historical label's timestamp
# plus 5x negatives, so the trainer has features to join the Eagle-i labels
# against. Idempotent: wipes its own window (older than 14 days) and re-inserts.
on:
  workflow_dispatch:

concurrency:
  group: backfill-outage-features
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # first run hits Open-Meteo 78 times and can be slow; cached runs take ~5 min
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: ingestion
        run: pip install -e .[ml]

      # default window is 365 days; rebuild labels over the full 2023-2025 archive
      - name: Re-synthesize eagle_i labels (full 3y window)
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.pipeline.eagle_i_to_labels --window-days 1200

      # one Open-Meteo call per muni, cached. Runs before the features
      # backfill so it can join weather inline instead of patching per row.
      - name: Cache daily weather (Open-Meteo)
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # trainer can still run on grid + time features without weather
        continue-on-error: true
        run: python -m src.pipeline.backfill_daily_weather

      - name: Backfill outage_features (joins daily weather inline)
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.pipeline.backfill_outage_features

      - name: Train (only publishes if it beats the heuristic)
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # exits non-zero when the readiness/Brier gate fails; don't fail the backfill
        continue-on-error: true
        run: python -m ml.train

      - name: Predict
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m ml.predict
